<!DOCTYPE html>
<html>
<head>
    <title>P2P Photo Chat</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: #f0f2f5; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: white; padding: 10px; border-radius: 8px; max-width: 70%; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg img { max-width: 100%; border-radius: 4px; display: block; margin-top: 5px; }
        .input-area { background: white; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        #peer-info { background: #007bff; color: white; padding: 10px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div id="peer-info">Initializing your ID...</div>
    <div class="input-area" id="connect-area">
        <input type="text" id="remote-id" placeholder="Enter Friend's ID to Connect">
        <button onclick="connectToPeer()">Connect</button>
    </div>
    <ul id="messages"></ul>
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Type a message...">
        <label style="cursor:pointer; font-size: 20px;">🖼️<input type="file" id="img-input" accept="image/*" style="display:none"></label>
        <button onclick="sendText()">Send</button>
    </div>

    <script>
        const peer = new Peer(); // Creates a unique ID for you
        let conn;

        // Display your unique ID so you can share it
        peer.on('open', id => {
            document.getElementById('peer-info').innerHTML = `Your ID: <b>${id}</b> (Send this to your friend)`;
        });

        // Listen for incoming connections
        peer.on('connection', c => {
            conn = c;
            setupConnection();
        });

        // Function to connect to a friend's ID
        function connectToPeer() {
            const remoteId = document.getElementById('remote-id').value;
            conn = peer.connect(remoteId);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                addMessage('System', 'Connected!');
                document.getElementById('connect-area').style.display = 'none';
            });
            conn.on('data', data => {
                if (data.type === 'text') addMessage('Friend', data.content);
                if (data.type === 'image') addImage('Friend', data.content);
            });
        }

        function sendText() {
            const val = document.getElementById('msg-input').value;
            if (conn && val) {
                conn.send({ type: 'text', content: val });
                addMessage('You', val);
                document.getElementById('msg-input').value = '';
            }
        }

        // Handle sending images
        document.getElementById('img-input').addEventListener('change', e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = () => {
                if (conn) {
                    conn.send({ type: 'image', content: reader.result });
                    addImage('You', reader.result);
                }
            };
            reader.readAsDataURL(file);
        });

        function addMessage(user, text) {
            const li = document.createElement('li');
            li.className = 'msg';
            li.innerHTML = `<b>${user}:</b> ${text}`;
            document.getElementById('messages').appendChild(li);
        }

        function addImage(user, src) {
            const li = document.createElement('li');
            li.className = 'msg';
            li.innerHTML = `<b>${user}:</b><img src="${src}">`;
            document.getElementById('messages').appendChild(li);
        }
    </script>
</body>
</html>
